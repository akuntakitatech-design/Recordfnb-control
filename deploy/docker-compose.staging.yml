services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fnb_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      fnb_staging:
        aliases:
          - fnb-staging-db

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.staging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8098:3000"
    volumes:
      - fnb_staging_uploads:/data/uploads
    networks:
      fnb_staging: {}
      existing_proxy:
        aliases:
          - fnb-staging-app

volumes:
  fnb_staging_postgres:
  fnb_staging_uploads:

networks:
  fnb_staging:
    driver: bridge
  existing_proxy:
    external: true
    name: ${PROXY_NETWORK:-02-vps-selfhost_kebun}
